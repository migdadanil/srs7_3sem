name: Проверка проекта

on:
  push:
    branches: [main, feature/srs8-documentation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'

      - name: Проверка документации
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = ['README.md', 'docs/architecture.md',
                   'docs/database.md', 'docs/api.md',
                   'docs/deployment.md', 'docs/troubleshooting.md']

          for file in files:
              path = Path(file)
              assert path.is_file(), f'Нет файла {file}'
              content = path.read_text()
              assert content.strip(), f'Пустой файл {file}'

              for link in re.findall(r'\]\(([^)\s]+)\)', content):
                  if link.startswith(('http://', 'https://', '#')):
                      continue
                  assert (path.parent / link.split('#')[0]).exists(), f'Не найдена ссылка {link}'

              print(f'{file}: OK')
          PY

      - name: Проверка чистого запуска
        run: make test-clean
